name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typer, enhetstester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - name: Skjema er generert og oppdatert
        run: pnpm generate:schema && git diff --exit-code -- generated/

  build:
    name: Bygg
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CMS_PROVIDER: mock
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  e2e:
    name: Ende-til-ende (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CMS_PROVIDER: mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CMS_PROVIDER: mock
      - run: pnpm lighthouse
        env:
          CMS_PROVIDER: mock

  payload:
    name: Payload-pilot (SQLite, seed, bygg, e2e)
    runs-on: ubuntu-latest
    needs: check
    env:
      CMS_PROVIDER: payload
      PAYLOAD_SECRET: ci-secret
      DATABASE_URL: file:./payload.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: Ci-passord-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dev-server pusher skjema til SQLite, seed via API
        run: |
          pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 60); do sleep 2; curl -sf -o /dev/null http://localhost:3000/robots.txt && break; done
          curl -sf -X POST http://localhost:3000/api/seed -H "x-payload-secret: $PAYLOAD_SECRET"
          pkill -f "next dev" || true
          sleep 2
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E mot Payload
        run: |
          pnpm start > start.log 2>&1 &
          for i in $(seq 1 30); do sleep 2; curl -sf -o /dev/null http://localhost:3000/robots.txt && break; done
          PLAYWRIGHT_BASE_URL=http://localhost:3000 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: payload-logs
          path: |
            dev.log
            start.log
            playwright-report
