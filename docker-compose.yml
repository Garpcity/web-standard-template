# Lokal utvikling. Start det du trenger:
#   docker compose up postgres            # for Payload (fase 4)
#   docker compose up wordpress           # for WordPress-piloten (fase 3)
#   docker compose up n8n                 # for integrasjonsflyter
#   docker compose --profile all up       # alt
services:
  postgres:
    image: postgres:17-alpine
    profiles: ["payload", "all"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  mariadb:
    image: mariadb:11
    profiles: ["wordpress", "all"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes: ["mariadb-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  wordpress:
    image: wordpress:6-php8.3-apache
    profiles: ["wordpress", "all"]
    depends_on:
      mariadb:
        condition: service_healthy
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - "wordpress-data:/var/www/html"
      # Core-pluginen med alle post types og felter (fase 3):
      - "./wordpress/plugins/site-core:/var/www/html/wp-content/plugins/site-core"

  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n", "all"]
    ports: ["5678:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Oslo
      N8N_SECURE_COOKIE: "false"
    volumes: ["n8n-data:/home/node/.n8n"]

volumes:
  postgres-data:
  mariadb-data:
  wordpress-data:
  n8n-data:
